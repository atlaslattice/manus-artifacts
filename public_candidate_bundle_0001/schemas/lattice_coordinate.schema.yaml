schema_id: lattice_coordinate.schema.v0.1
status: public_candidate
canon_status: not_canon
deployment_status: not_deployed
authority_scope: none
purpose: >
  Represent coordinates inside the Rainbow Yin Yang / 12x12x12 Hypercube
  without flattening the lattice into a single hierarchy, proof system, or
  source of truth.

required_fields:
  - coordinate_id
  - axis_a
  - axis_b
  - axis_c
  - projection_type
  - domain_tags
  - artifact_refs
  - claim_refs
  - review_status
  - canon_status
  - public_release_status

fields:
  coordinate_id:
    type: string
    description: Stable coordinate identifier for a cell or projected cell in the 12x12x12 lattice.
    example: LATTICE-01-04-09

  axis_a:
    type: object
    required: [index, label]
    description: First axis of the 12x12x12 coordinate. Axis names are candidate and may evolve.
    fields:
      index:
        type: integer
        minimum: 1
        maximum: 12
      label:
        type: string

  axis_b:
    type: object
    required: [index, label]
    description: Second axis of the 12x12x12 coordinate. Axis names are candidate and may evolve.
    fields:
      index:
        type: integer
        minimum: 1
        maximum: 12
      label:
        type: string

  axis_c:
    type: object
    required: [index, label]
    description: Third axis of the 12x12x12 coordinate. Axis names are candidate and may evolve.
    fields:
      index:
        type: integer
        minimum: 1
        maximum: 12
      label:
        type: string

  projection_type:
    type: enum
    description: The view/projection being used. No projection is the whole cube.
    values:
      - table_view
      - graph_view
      - color_harmonic_view
      - frequency_view
      - matter_property_view
      - isotope_element_view
      - acoustic_resonance_view
      - neuromorphic_view
      - invention_archive_view
      - review_status_view
      - public_release_view
      - other

  domain_tags:
    type: array
    items: string
    description: Candidate domains mapped to this coordinate.
    examples:
      - matter_properties
      - acoustic_resonance
      - frequency_ranges
      - color_harmonic_spectrum
      - neuromorphic_principles
      - invention_archive
      - review_lane

  artifact_refs:
    type: array
    items: string
    description: Source artifact IDs or paths associated with this coordinate.

  claim_refs:
    type: array
    items: string
    description: Claim packet IDs associated with this coordinate.

  receipt_refs:
    type: array
    items: string
    description: Evidence, source, or receipt packet IDs associated with this coordinate.

  contradiction_refs:
    type: array
    items: string
    description: Contradiction or fossil lineage records associated with this coordinate.

  review_status:
    type: enum
    values:
      - unreviewed
      - needs_source_passport
      - needs_receipts
      - needs_adversarial_review
      - reviewed_public_safe
      - human_root_review_needed
      - deferred
      - quarantined

  canon_status:
    type: enum
    values:
      - not_canon
      - candidate
      - fossil
      - public_candidate
      - council_reviewed
      - human_root_adjudicated
      - website_canon

  public_release_status:
    type: enum
    values:
      - private_raw
      - private_review
      - public_candidate
      - public_reviewed
      - public_archived
      - public_deprecated
      - blocked_license
      - blocked_privacy
      - blocked_receipt
      - blocked_rights

invariants:
  - coordinate_not_authority
  - projection_not_totality
  - cluster_not_canon
  - graph_edge_not_promotion
  - many_versions_before_synthesis
  - fossils_preserved
  - council_before_canon
  - website_before_law

safe_wording:
  - A lattice coordinate is an index handle, not an authority claim.
  - A projection can be useful without being complete.
  - Coordinates help route review; they do not decide truth.

forbidden_wording:
  - This coordinate proves the claim.
  - This projection is the whole lattice.
  - This cluster is canon.
  - This graph position grants authority.
