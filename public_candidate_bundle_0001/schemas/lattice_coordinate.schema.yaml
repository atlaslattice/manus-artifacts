schema_id: lattice_coordinate.schema.v0.2
status: public_candidate
canon_status: not_canon
deployment_status: not_deployed
authority_scope: none
purpose: >
  Represent entry-level H-S-N coordinates inside the Rainbow Yin Yang /
  12x12x12 Hypercube as an addressable public coordinate surface inside a
  broader 12D full-flywheel ontology, without flattening the lattice into a
  single hierarchy, proof system, source of truth, or authority surface.

coordinate_grammar:
  entry_coordinate: H##.S##.N##
  house: H
  sphere: S
  node: N
  note: >
    H-S-N is the entry coordinate surface. The 12D flywheel is the fuller
    operating model. A coordinate is an address, not the entire ontology.

required_fields:
  - coordinate_id
  - house
  - sphere
  - node
  - projection_type
  - domain_tags
  - artifact_refs
  - claim_refs
  - review_status
  - canon_status
  - public_release_status
  - authority_scope
  - deployment_status

fields:
  coordinate_id:
    type: string
    description: Stable entry coordinate identifier for a cell or projected cell in the 12x12x12 H-S-N lattice.
    example: H01.S04.N09

  house:
    type: object
    required: [index, label]
    description: Entry coordinate House component. Houses are candidate top-level domains or habitat families.
    fields:
      index:
        type: integer
        minimum: 1
        maximum: 12
      label:
        type: string

  sphere:
    type: object
    required: [index, label]
    description: Entry coordinate Sphere component. Spheres are candidate semantic or operational containers inside or across Houses.
    fields:
      index:
        type: integer
        minimum: 1
        maximum: 12
      label:
        type: string

  node:
    type: object
    required: [index, label]
    description: Entry coordinate Node component. Nodes are addressable cells, artifacts, claim families, experiments, prototypes, or review targets.
    fields:
      index:
        type: integer
        minimum: 1
        maximum: 12
      label:
        type: string

  flywheel_dimensions:
    type: object
    description: Optional or required-by-profile 12D flywheel metadata. H-S-N does not exhaust the ontology.
    fields:
      d01_house:
        type: object
        description: Mirrors or expands the House dimension.
      d02_sphere:
        type: object
        description: Mirrors or expands the Sphere dimension.
      d03_node:
        type: object
        description: Mirrors or expands the Node dimension.
      d04_source_lineage:
        type: object
        description: Source, origin, hash, raw-path, export status, or lineage notes.
      d05_claim_semantic_content:
        type: object
        description: Claim text, strongest safe wording, semantic tags, and overclaims to avoid.
      d06_evidence_receipt_strength:
        type: object
        description: Receipt strength, source quality, citations, tests, reproducible runs, contradictions, or gaps.
      d07_review_adversarial_status:
        type: object
        description: Review route, adversarial status, blockers, and next review action.
      d08_authority_canon_boundary:
        type: object
        description: Authority scope, canon status, ratification status, and promotion constraints.
      d09_deployment_execution_boundary:
        type: object
        description: Deployment status, execution permission, sandbox state, or gate requirements.
      d10_temporal_version_state:
        type: object
        description: Version, branch, supersession, fossil state, contradiction branch, or active surface.
      d11_resonance_projection_state:
        type: object
        description: Projection/view state such as graph, frequency, acoustic, neuromorphic, quantum, cryptographic, matter-property, color-harmonic, invention archive, or public release view.
      d12_conservation_routing_quarantine_state:
        type: object
        description: Preservation, compression, archive, quarantine, fork, inherit, recovery, reject, or review route.

  projection_type:
    type: enum
    description: The view/projection being used. No projection is the whole flywheel.
    values:
      - table_view
      - graph_view
      - color_harmonic_view
      - frequency_view
      - matter_property_view
      - isotope_element_view
      - acoustic_resonance_view
      - neural_network_view
      - neuromorphic_view
      - reversible_computing_view
      - reservoir_computing_view
      - quantum_computing_view
      - quantum_information_view
      - cryptography_view
      - post_quantum_cryptography_view
      - invention_archive_view
      - review_status_view
      - public_release_view
      - full_flywheel_view
      - other

  domain_tags:
    type: array
    items: string
    description: Candidate domains mapped to this coordinate.
    examples:
      - matter_properties
      - acoustic_resonance
      - frequency_ranges
      - color_harmonic_spectrum
      - neural_networks
      - neuromorphic_principles
      - reversible_computing
      - reservoir_computing
      - quantum_computing
      - quantum_information
      - cryptography
      - post_quantum_cryptography
      - key_exchange
      - digital_signatures
      - invention_archive
      - review_lane

  artifact_refs:
    type: array
    items: string
    description: Source artifact IDs or paths associated with this coordinate.

  claim_refs:
    type: array
    items: string
    description: Claim packet IDs associated with this coordinate.

  receipt_refs:
    type: array
    items: string
    description: Evidence, source, or receipt packet IDs associated with this coordinate.

  contradiction_refs:
    type: array
    items: string
    description: Contradiction or fossil lineage records associated with this coordinate.

  review_status:
    type: enum
    values:
      - unreviewed
      - needs_source_passport
      - needs_receipts
      - needs_adversarial_review
      - reviewed_public_safe
      - human_root_review_needed
      - deferred
      - quarantined

  canon_status:
    type: enum
    values:
      - not_canon
      - candidate
      - fossil
      - public_candidate
      - council_reviewed
      - human_root_adjudicated
      - website_canon

  authority_scope:
    type: enum
    values:
      - none
      - advisory
      - gated
      - ratified

  deployment_status:
    type: enum
    values:
      - not_deployed
      - not_deployable
      - sandbox_only
      - staged
      - gated
      - deployed_by_explicit_authorization

  public_release_status:
    type: enum
    values:
      - private_raw
      - private_review
      - public_candidate
      - public_reviewed
      - public_archived
      - public_deprecated
      - blocked_license
      - blocked_privacy
      - blocked_receipt
      - blocked_rights

invariants:
  - hsn_is_entry_coordinate_not_totality
  - coordinate_not_authority
  - projection_not_totality
  - cluster_not_canon
  - graph_edge_not_promotion
  - resonance_not_proof
  - quantum_advantage_not_assumed
  - crypto_security_not_self_certifying
  - post_quantum_ready_not_deployed_by_label
  - node_not_truth
  - many_versions_before_synthesis
  - fossils_preserved
  - council_before_canon
  - website_before_law
  - human_root_before_authority

safe_wording:
  - H-S-N is the entry coordinate surface; the 12D flywheel is the fuller operating model.
  - A lattice coordinate is an index handle, not an authority claim.
  - A projection can be useful without being complete.
  - Coordinates help route review; they do not decide truth.
  - Extra dimensions must not imply authority without status, receipt, review, and human-root gates.
  - Quantum computing and post-quantum cryptography nodes require current standards and security review receipts before any implementation claim.

forbidden_wording:
  - This coordinate proves the claim.
  - H-S-N is the whole ontology.
  - This projection is the whole lattice.
  - This cluster is canon.
  - This graph position grants authority.
  - Resonance compatibility proves deployment readiness.
  - Quantum labeling proves speedup or security.
  - Post-quantum label means migration is complete.
  - A node can self-promote to canon.
