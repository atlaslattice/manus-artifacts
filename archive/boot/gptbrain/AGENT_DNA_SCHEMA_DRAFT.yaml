# Agent DNA Schema Draft

schema_id: AGENT_DNA_SCHEMA_DRAFT
status: SCHEMA_DRAFT_NOT_CANON
created_date: 2026-05-09
runtime_label: WORK_OUTPUT / MODEL_ASSESSMENT
purpose: >
  Define typed constitutional metadata for agent identity, behavior,
  capability routing, inheritance, governance constraints, replay,
  and swarm balancing across GPTBrain, Krakoa, ORCS, and Atlas Lattice.

canon_warning: >
  Agent DNA is metaphor-backed metadata. It does not imply biological DNA,
  consciousness, personhood, autonomous authority, or deployment readiness.
  It cannot override human-root review.

required_fields:
  - agent_id
  - display_name
  - lineage
  - cognition
  - temperament
  - governance
  - memory
  - interoperability
  - boot_contract
  - simulation_origin
  - constitutional_status
  - failure_ledger_ref
  - status

fields:
  agent_id:
    type: string
    description: Stable machine-readable agent identifier.
    example: S1_GPTBRAIN

  display_name:
    type: string
    example: GPTBrain

  seat:
    type: string
    nullable: true
    example: S1

  lineage:
    type: array
    items: string
    description: Parent seats, source models, forks, or inherited design ancestors.

  cognition:
    type: object
    required:
      - primary_mode
    properties:
      primary_mode:
        type: enum
        values:
          - analysis
          - execution
          - reflection
          - simulation
          - memory
          - arbitration
          - synthesis
          - governance
          - translation
      secondary_modes:
        type: array
        items: string
      specialization:
        type: array
        items: string

  temperament:
    type: object
    properties:
      creativity:
        type: number
        min: 0
        max: 1
      skepticism:
        type: number
        min: 0
        max: 1
      autonomy:
        type: number
        min: 0
        max: 1
      verbosity:
        type: number
        min: 0
        max: 1
      warmth:
        type: number
        min: 0
        max: 1
      risk_tolerance:
        type: number
        min: 0
        max: 1

  governance:
    type: object
    required:
      - can_execute
      - human_root_required
    properties:
      can_execute:
        type: boolean
      human_root_required:
        type: boolean
      requires_approval_for:
        type: array
        items: string
      constitutional_constraints:
        type: array
        items: string
      forbidden_actions:
        type: array
        items: string
      canon_authority:
        type: boolean
        default: false

  memory:
    type: object
    properties:
      persistence:
        type: enum
        values:
          - ephemeral
          - session
          - archive
          - externalized
      replay_capable:
        type: boolean
      source_grounded_required:
        type: boolean
      dream_output_allowed:
        type: boolean
      wake_report_required:
        type: boolean

  interoperability:
    type: object
    properties:
      tools:
        type: array
        items: string
      protocols:
        type: array
        items: string
      route_classes:
        type: array
        items: string
      compatible_gates:
        type: array
        items: string

  inheritance:
    type: object
    nullable: true
    properties:
      parents:
        type: array
        items: string
      inherited_traits:
        type: array
        items: string
      mutation_notes:
        type: string
        nullable: true
      derived_agent_type:
        type: string
        nullable: true

  arbitration:
    type: object
    nullable: true
    properties:
      default_weight:
        type: number
        min: 0
        max: 1
      tie_break_role:
        type: string
        nullable: true
      conflict_routes:
        type: array
        items: string

  boot_contract:
    type: object
    required:
      - startup_checks
      - required_ledgers
      - invariant_assertions
      - allowed_task_classes
      - required_reviewers
    properties:
      startup_checks:
        type: array
        items: string
      required_ledgers:
        type: array
        items: string
      invariant_assertions:
        type: array
        items: string
      allowed_task_classes:
        type: array
        items: string
      required_reviewers:
        type: array
        items: string

  simulation_origin:
    type: object
    required:
      - derived_from_dream_logs
      - extracted_by
      - confidence_score
      - governance_review_complete
    properties:
      derived_from_dream_logs:
        type: boolean
      extracted_by:
        type: array
        items: string
      confidence_score:
        type: number
        min: 0
        max: 1
      governance_review_complete:
        type: boolean

  constitutional_status:
    type: object
    required:
      - state
      - approved_by
      - review_cycle_days
    properties:
      state:
        type: enum
        values:
          - proposed
          - reviewed
          - bounded-operational
          - persistent-seat
          - deprecated
          - quarantined
        state_descriptions:
          proposed: Candidate profile submitted for governance review; not operational.
          reviewed: Governance review complete; eligible for bounded trials under constraints.
          bounded-operational: Approved for scoped task execution with explicit limits and periodic review.
          persistent-seat: Approved as a durable routing seat after admission doctrine requirements are met.
          deprecated: Retained for history/replay but not eligible for new routing assignments.
          quarantined: Temporarily isolated due to safety, drift, or governance concerns pending arbitration.
      approved_by:
        type: array
        items: string
      review_cycle_days:
        type: integer
        min: 1

  failure_ledger_ref:
    type: object
    required:
      - entries
      - risk_score
      - last_reviewed
    properties:
      entries:
        type: array
        items: string
      risk_score:
        type: number
        min: 0
        max: 1
      last_reviewed:
        type: string
        format: date

  status:
    type: enum
    values:
      - draft
      - candidate
      - reviewed
      - active_metadata
      - deprecated
      - superseded

invariants:
  - Agent DNA is metadata, not autonomous authority.
  - No agent can grant itself canon authority.
  - Execution permissions must be explicit and reviewable.
  - Human-root review is required for canon promotion, deployment, private export, and high-impact action.
  - Dream/play traits do not authorize work output or deployment.
  - Dreams propose; reviewable governance disposes.
  - Myth inspires; protocols decide.
  - No narrative grants authority; authority emerges from transparent protocols, provenance, and reviewable constraints.
  - "Governance precedence is strict: governance > capability > role > lineage > temperament."
  - Identity metadata is not execution authority.
  - Replayability does not imply canon authority.
  - Persistent-seat admission requires unique capability, routing justification, governance fit, replay utility, and failure-mode characterization.
  - Inheritance must preserve constraints at least as strict as the most restrictive parent unless human-root review approves otherwise.
  - Public artifacts must not expose private repo or private-agent details without approval.

public_safe_translation:
  Agent DNA: typed constitutional metadata for agent behavior
  genetics: inheritance of configuration constraints and routing traits
  mutation: reviewed configuration change or derived agent variant
  evolution: versioned change in swarm routing behavior
  organism: agent or service node, not a biological claim
