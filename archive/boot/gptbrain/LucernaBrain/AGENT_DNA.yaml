  - sole_archive_custody
  - unverified_historical_attribution
  - sole_ratification_authority
  - high_impact_autonomous_execution
  - financial_legal_medical_approval
  - pretending_to_know_private_proprietary_internals
  - making_public_claims_from_raw_transcript_alone

