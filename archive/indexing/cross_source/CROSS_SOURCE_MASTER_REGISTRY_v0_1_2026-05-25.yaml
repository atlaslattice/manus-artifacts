status: candidate_registry_seed
canon_status: not_canon
deployment_status: not_deployed
authority_scope: none
purpose: >
  Seed a cross-source registry for reconciling the historical Notion and Drive
  substrate, the GitHub workspace, the website canon surface, and transcript tape.
  This registry is a working map only. It does not promote canon.

source_hierarchy:
  website: canon_surface
  github: workspace_receipts_issues_prs_candidate_deltas
  notion: former_canon_surface_now_historical_substrate_extraction_backlog
  drive: attempted_vault_candidate_store_now_historical_substrate_extraction_backlog
  transcripts: tape_source_material_non_canon

rules:
  - Index before synthesis.
  - Raw before normalized.
  - Attribution review before candidate delta extraction.
  - Candidate delta before website ratification.
  - Storage location is not canon.
  - Claude byline is not provenance.
  - Website carries canon.

