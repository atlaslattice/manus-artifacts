# Aetherforge / Sheldonbrain Knowledge Graph Source Inventory

inventory_id: KG_SOURCE_INVENTORY_2026-05-27
status: CANDIDATE_OPERATION_NOT_CANON
mode: READ_ONLY_SOURCE_MAPPING_TO_MASS_INGESTION_PREP
created_utc: "2026-05-27T00:00:00Z"
keeper: >
  The graph shows where review is needed. It does not decide what is true.

invariants:
  - GitHub receipt is not canon.
  - Notion source root is not truth authority.
  - PR existence is not ratification.
  - Mirror status is not source completeness.
  - Parser output is a retrieval aid, not raw evidence.
  - Graph edge is not promotion.
  - Cluster density is not truth.
  - Graph centrality is not authority.
  - Nothing dies: missing receipts, contradictions, stale pages, and negative results must be recorded.

allowed_raw_export_status:
  - not_exported
  - partial_export
  - full_raw_export_attached
  - full_raw_export_hashed
  - redacted_raw_export_attached
  - unavailable

