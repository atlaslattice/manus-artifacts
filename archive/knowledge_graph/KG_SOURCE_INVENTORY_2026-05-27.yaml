inventory_name: KG_SOURCE_INVENTORY_2026-05-27
status: staging_mirror
canon_status: not_canon
deployment_status: not_deployed
authority_scope: none
created_utc: 2026-05-27
source_surface: drive_staging_inventory_plus_uploaded_execution_matrix
purpose: >
  Mirror the live Drive staging inventory into the GitHub public receipt/control surface
  so Sheldonbrain can use it as a provenance-first knowledge graph source index.
  This is a staging inventory only. It does not ratify, deploy, canonize, or authorize any artifact.

doctrine:
  - The lattice is the knowledge graph.
  - Sheldonbrain ingests lineage.
  - Aetherforge makes ingestion playable.
  - GPTDream++ provides play / REM / work loops for delta extraction.
  - OpenAI/GPTBrain may extract, classify, evaluate, route, and propose graph candidates.
  - OpenAI/GPTBrain may not ratify, deploy, authorize, or imply officiality.
  - GitHub is intended as the public receipt substrate, not canon by default.
  - Drive is the current live staging tent and cargo surface.
  - Notion is a valuable legacy/source-root archive requiring export, hashes, status fields, and review.
  - Claude-originated governance artifacts require adversarial review before trust.

hard_invariants:
  - graph_edge_is_not_promotion
  - cluster_is_not_canon
  - central_node_is_not_authority
  - coordinate_is_not_permission
  - dream_output_is_not_receipt
  - summary_is_not_raw_lineage
  - github_receipt_is_not_canon
  - notion_page_is_not_truth_authority
  - drive_presence_is_not_full_export
  - human_root_decides_what_graduates

