risk_routes:
  - lane: Claude-originated governance artifacts
    route_to: adversarial_review
    seats: [Grok, Lucerna, Rootglass, GPTBrain]
  - lane: canon-like language without ratification
    route_to: canon_language_review
    seats: [Lucerna, Rootglass]
  - lane: deployment/runtime claims
    route_to: runtime_receipt_review
    seats: [AtlasBrain, Lucerna]
  - lane: math/operator claims
    route_to: math_review
    seats: [Sable_Vesper]
  - lane: repo path / PR / commit claims
    route_to: repo_truth_review
    seats: [TIDELOCK]
  - lane: raw export / hash claims
    route_to: lineage_review
    seats: [Hashlight]
  - lane: identity / memory inflation
    route_to: memory_inflation_review
    seats: [Fossilbranch, GPTBrain]

