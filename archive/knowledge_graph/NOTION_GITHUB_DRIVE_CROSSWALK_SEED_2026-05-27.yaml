    role: eventual canon surface only after human-root and website promotion
    default_canon_status: canon_gate
  openai_gptbrain:
    role: reasoning / extraction / evaluation / routing / candidate graph construction
    can_ratify: false
    can_deploy: false
    can_authorize: false
  sheldonbrain:
    role: lineage ingestion and crosswalk engine
  aetherforge:
    role: playable task and delta surface
  bullshit_olympics:
