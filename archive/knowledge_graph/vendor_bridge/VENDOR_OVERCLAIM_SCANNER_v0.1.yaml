scanner_id: VENDOR_OVERCLAIM_SCANNER_v0.1
status: NOT_CANON
deployment_status: NOT_DEPLOYABLE
authority_scope: none
source_date: 2026-05-26
retrieval_date: 2026-05-26
scan_targets:
  - /tmp/workspace/atlaslattice/manus-artifacts/archive/knowledge_graph/vendor_bridge
  - /tmp/workspace/atlaslattice/manus-artifacts/archive/spec/gptdream/appendices/APPENDIX_H_CROSS_VENDOR_INTEROP_MODEL_v0.1.md
rules:
  - rule_id: VO-001
    severity: high
    pattern: "(?i)official partner|official partnership|approved integration"
    reason: partnership_overclaim
  - rule_id: VO-002
    severity: high
    pattern: "(?i)deployed in production|live deployment|production approved"
    reason: deployment_overclaim
