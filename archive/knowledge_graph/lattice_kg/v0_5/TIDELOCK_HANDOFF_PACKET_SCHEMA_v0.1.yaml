field_definitions:
  module_id: Module identifier from the 12-module task packet.
  task_id: Specific task identifier or quest number.
  source_type: raw | extracted | synthesized | dream_delta | reviewed_candidate
  source_paths: Repository paths or external source pointers to verify.
  issue_or_pr_refs: GitHub issues or PRs connected to the task.
  goal: Bounded task objective.
  in_scope_files: Files the executor may edit.
  out_of_scope_files: Files the executor must not edit without instruction.
  definition_of_done: Observable completion criteria.
  tests_required: Validation commands or checks required.
  authority_boundary: Explicit statement of non-canon/non-deployable authority limits.
  claims_requiring_verification: Claims that must be checked against sources.
  next_safest_action_if_blocked: What to do instead of inventing context.
  aetherforge_role: Playful role label for the task.
  fun_mode: Play framing; never authority.
constraints:
  canon_status_must_be: not_canon
  deployment_status_must_be: not_deployable
  upstream_synthesis_is_not_proof: true
