status: candidate_schema
canon_status: not_canon
deployment_status: not_deployable
authority: none
purpose: Keep GPT cohort preprocessing separate from Copilot/TIDELOCK repo-grounded execution.
required_fields:
  - module_id
  - task_id
  - source_type
  - source_paths
  - issue_or_pr_refs
  - goal
  - in_scope_files
  - out_of_scope_files
