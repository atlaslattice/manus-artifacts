edge_templates:
  - edge_type: maps_public_entry_to_implementation_dimension
    from: H##.S##.N##
    to: D##
    required_fields: [source_ref, confidence, review_status]
  - edge_type: implemented_by_graph_node
    from: H##.S##.N##
    to: artifact_id
    required_fields: [github_path, raw_export_status, canon_status]
  - edge_type: website_canon_supported_by_receipt
    from: website_canon_id
    to: github_artifact_id
    required_fields: [canon_url, receipt_url, claim_scope]
  - edge_type: projection_of
    from: local_projection_id
    to: H##.S##.N##
    required_fields: [projection_type, boundary_note]

