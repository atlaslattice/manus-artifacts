purpose: >
  Bridge the public House-Sphere-Node entry coordinate grammar from
  docs/LATTICE_HYPERCUBE_12x12x12.md to the PR #24 / v0.6 D01-D12
  implementation and traversal dimension registry. This file uses the graph
  layer as a routing substrate and prevents public coordinate language from
  drifting away from implementation receipts.

source_surfaces:
  public_explainer:
    path: docs/LATTICE_HYPERCUBE_12x12x12.md
    role: public_safe_entry_explainer
    coordinate_surface: H##.S##.N##
    status: public_candidate_explainer
  implementation_topology:
    path: archive/knowledge_graph/lattice_kg/v0_6/HYPERCUBE_12D_TOPOLOGY_v1.0.yaml
    pr: "#24"
    role: implementation_traversal_registry
    coordinate_surface: D01-D12
    status: draft_pr_surface
  website:
    role: canon_surface
    note: Website canon URLs must be added before this crosswalk is public-ready.

root_rule: >
  H-S-N is the public entry coordinate surface. D01-D12 is the current
  GitHub implementation and traversal dimension registry. The two are
  complementary views of the living archive, not competing ontologies.

boundary:
  - coordinate_is_not_truth
  - coordinate_is_not_canon
  - coordinate_is_not_authority
  - coordinate_is_not_deployment
  - coordinate_is_not_permission
  - github_receipt_does_not_override_website_canon
  - graph_connection_is_not_promotion

