# ──────────────────────────────────────────────────────────────────────────────
# SHARED ID CONTRACT
# Every node in the lattice carries a globally unique artifact_id with the form:
#   <dimension_short>.<domain_slug>.<seq>
# Examples:
#   governance.canon_model.v1
#   kg_layer.ontology.v0_6
#   cicd.hypercube_integrity.v1
# ──────────────────────────────────────────────────────────────────────────────
artifact_id_contract:
  format: "<dimension_short>.<domain_slug>.<version>"
  uniqueness: global          # No two nodes may share an artifact_id
  immutability: true          # artifact_id never changes after first commit
  namespace_separator: "."

# ──────────────────────────────────────────────────────────────────────────────
# SHARED PROVENANCE MODEL
# All nodes inherit from LatticeObject (v0.5 ontology) extended with
# dimension_id and cross_links.
# ──────────────────────────────────────────────────────────────────────────────
provenance_model:
  base_schema: "archive/knowledge_graph/lattice_kg/v0_5/lattice_ontology_v0.5.yaml"
  required_extension_fields:
    - dimension_id          # one of D01–D12
    - cross_links           # list of {target_artifact_id, edge_type}
  optional_extension_fields:
    - aetherforge_face      # numeric 1–12 mirrors dimension number
    - metatron_node         # Metatron's Cube node label (optional play layer)
  cross_link_minimum: 1     # every node must link to at least one other node

# ──────────────────────────────────────────────────────────────────────────────
# SHARED ONTOLOGY (extends v0.5)
# ──────────────────────────────────────────────────────────────────────────────
ontology_extends: "archive/knowledge_graph/lattice_kg/v0_5/lattice_ontology_v0.5.yaml"
additional_node_families:
  hypercube_index_family:
    - hypercube_global_index   # generated by build_lattice_global_index.py
    - dimension_anchor         # one anchor per dimension
    - cross_link_registry      # registry of all cross-dimension edges
additional_edge_types:
  traverses_dimension:
    description: An edge that crosses from one dimension face to another.
    required_fields: [from_dimension, to_dimension, edge_type]
  indexes:
    description: The global index node indexes an artifact node.
    allowed_sources: [hypercube_global_index]
    allowed_targets: [LatticeObject]

# ──────────────────────────────────────────────────────────────────────────────
# INTEGRITY INVARIANTS (enforced by validate_hypercube_integrity.py)
# ──────────────────────────────────────────────────────────────────────────────
integrity_invariants:
  no_orphan_nodes: true          # every node has >= 1 cross_link
  no_duplicate_artifact_ids: true
  no_isolated_subgraphs: true    # the whole graph must be connected
  schema_drift_forbidden: true   # every node must validate against base schema
  all_dimensions_represented: true  # every D01–D12 must appear in the index
  cross_link_targets_must_exist: true

# ──────────────────────────────────────────────────────────────────────────────
# PIPELINE SPEC
# ──────────────────────────────────────────────────────────────────────────────
ingestion_pipeline:
  script: "scripts/build_lattice_global_index.py"
  output: "archive/knowledge_graph/lattice_kg/v0_6/lattice_global_index.jsonl"
  trigger: on every push affecting artifact markdown files
  steps:
    - crawl_all_markdown_frontmatter
    - assign_dimension_from_artifact_id_prefix
    - emit_node_record_per_artifact
    - emit_edge_record_per_cross_link
    - write_jsonl_index

query_surface:
  document: "archive/knowledge_graph/lattice_kg/v0_6/UNIFIED_LATTICE_QUERY_SURFACE_v1.0.md"
  cli: "scripts/build_lattice_global_index.py --query"

canon_boundary: >
  This topology document is candidate state.  No dimension, node family, or
  edge type defined here is canon until explicitly ratified with a
  ratification_event_id by @atlaslattice.
