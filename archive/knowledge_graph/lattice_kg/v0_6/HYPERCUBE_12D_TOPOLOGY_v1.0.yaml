artifact: HYPERCUBE_12D_TOPOLOGY_v1.0
version: "1.0"
status: candidate
canon_status: not_canon
deployment_status: not_deployable
authority: none
principle: >
  One unified 12-dimensional hypercube lattice — not a collection of isolated
  lego components.  Every artifact occupies exactly one primary dimension and
  may carry cross-links into any of the other eleven.  Retrieval, governance,
  and provenance are exercised over the whole structure as a single organism.

# ──────────────────────────────────────────────────────────────────────────────
# DIMENSION REGISTRY  (12 faces of the Metatron-Cube hypercube)
# ──────────────────────────────────────────────────────────────────────────────
dimensions:
  D01:
