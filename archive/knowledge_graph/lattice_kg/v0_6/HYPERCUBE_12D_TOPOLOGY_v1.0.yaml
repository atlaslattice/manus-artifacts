    short: governance
    task_range: "#1–#12"
    primary_node_families: [governance_family]
    anchor_artifact_id: "kg.root.governance.v1"
  D02:
    label: Legal, Privacy & Trust
    short: legal
    task_range: "#13–#24"
    primary_node_families: [risk_node_family]
    anchor_artifact_id: "kg.root.legal.v1"
  D03:
    label: Repository Architecture
    short: repo_arch
    task_range: "#25–#36"
    primary_node_families: [source_family]
    anchor_artifact_id: "kg.root.repo_arch.v1"
  D04:
