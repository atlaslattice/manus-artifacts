# --- Scale relationships ---
harmonic_ratios:
  description: >
    Key harmonic ratios in the Solfeggio/lattice system:
    528/432 = 1.2222... ≈ 11:9 ratio
    963/432 ≈ 2.229 (close to 9:4 ratio)
    The full solfeggio set (396, 417, 528, 639, 741, 852, 963)
    sums to digits 3, 6, or 9 (Tesla's 3-6-9 principle).
  tesla_369: >
    Each Solfeggio frequency's digit sum = 3, 6, or 9:
    396: 3+9+6=18, 1+8=9 ✓
    417: 4+1+7=12, 1+2=3 ✓
    528: 5+2+8=15, 1+5=6 ✓
    639: 6+3+9=18, 1+8=9 ✓
    741: 7+4+1=12, 1+2=3 ✓
    852: 8+5+2=15, 1+5=6 ✓
    963: 9+6+3=18, 1+8=9 ✓
  432hz_properties:
    - "432 = 16 × 27 = 2⁴ × 3³"
    - "432 = 1728^(2/3) — the lattice cube root squared"
    - "1728 = 432 × 4 = 12³ — the total lattice node count"
    - "432 × 4 = 1728 nodes (the full hypercube)"
