status: CANDIDATE_REGISTRY
canon_status: not_canon
deployment_status: none
authority: none
version: v0.1
date: 2026-05-21
purpose: >-
  Machine-readable candidate registry derived from the lane authority/scope matrix.
  This file routes swarm lanes by function, evidence class, missing receipts,
  conflict risk, and do-not-promote boundaries. It is not canon and does not
  grant authority.
source_artifacts:
  - archive/architecture/LANE_AUTHORITY_SCOPE_MATRIX_2026-05-21.md
  - uploaded memory_palace_scope_map
rules:
  - Map before judge.
  - Depth chart before cuts.
  - Identity is routing, not authority.
  - Evidence is substrate, not victory.
  - Doctrine is candidate until ratified.
  - Play is compression, not proof.
  - GitHub records receipts; GitHub is not automatic canon.
  - Human-root review is required for promotion.

schema:
  lane_name: string
  class: identity | evidence | doctrine | play | support | formalism
  strongest_unique_function: string
  authority_scope: none | advisory | review | ratification | execution
  canon_status: not_canon | candidate | ratified | deprecated | quarantined
  deployment_status: none | candidate | blocked | deployed
  source_refs: list
  missing_receipts: list
  overlaps_with: list
  conflict_risk: low | medium | high
  should_route_into: string
  preserve_as: string
  do_not_promote_as: list
  human_root_required: boolean

