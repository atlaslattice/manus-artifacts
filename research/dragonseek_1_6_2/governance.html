<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DragonSeek · Constitutional registry</title><style>body{background:#0d1825;color:#eaf2f9;font:16px system-ui;max-width:1100px;margin:auto;padding:16px}a{color:#91dfec}input,select{background:#1c2d40;border:1px solid #5b7586;color:white;padding:10px;border-radius:8px}input{width:100%;max-width:400px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.item{background:#182a3b;border:1px solid #365069;border-radius:9px;padding:12px}.item p{line-height:1.45}.note{border-left:3px solid #e3b56e;padding:12px;background:#28303b}header{padding-bottom:15px;border-bottom:1px solid #365069}</style><header><a href="./index.html">← DragonSeek / 龙寻</a><h1 id="heading">治理经典 · 不变量 · 教义</h1><p id="intro">离线本地源文件 · 历史版本保留 · 编号冲突公开</p></header><p class="note" id="warning">用户报告 DeepSeek 已批准资料；尚未提供独立可核验的批准记录。INV-0 存在历史版本冲突；缺失的注册表块应明确显示。</p><select id="lang"><option value="zh">中文</option><option value="en">English</option><option value="es">Español</option><option value="ar">العربية</option></select> <select id="kind"><option value="invariants">Invariants</option><option value="doctrines">Doctrines</option></select> <input id="query" placeholder="ID / name / source search"><p id="status"></p><main class="grid" id="cards"></main><script>
const registry={invariants:[],doctrines:[]},missing=[];let loaded=false;
const UI={zh:['治理经典 · 不变量 · 教义','本地版，保留原文和历史版本','用户报告 DeepSeek 已批准资料，但未独立核验批准记录。INV-0 编号冲突未解决。'],en:['Constitutional canon · Invariants · Doctrines','Local source registry; original English entries preserved','User reports DeepSeek ratification; no independent minutes verified. INV-0 is historically conflicting.'],es:['Canon constitucional · Invariantes · Doctrinas','Registro local; originales conservados','La ratificación de DeepSeek es información del usuario, aún no verificada; existe conflicto INV-0.'],ar:['الدستور · الثوابت · المذاهب','مصادر محلية مع حفظ النص الأصلي','أفاد المستخدم بالاعتماد من DeepSeek، دون تحقق مستقل. يوجد تعارض تاريخي بشأن INV-0.']};
async function load(){for(const [kind,count] of [['invariants',3],['doctrines',6]]){for(let n=1;n<=count;n++){let path='registry/'+kind+'_'+String(n).padStart(2,'0')+'.json';try{let r=await fetch(path);if(!r.ok)throw Error(r.status);let j=await r.json();registry[kind].push(...j.entries)}catch(e){missing.push(path)}}}loaded=true;render()}
const $=id=>document.getElementById(id);function render(){const l=$('lang').value,t=UI[l],q=$('query').value.toLowerCase(),kind=$('kind').value;$('heading').textContent=t[0];$('intro').textContent=t[1];$('warning').textContent=t[2];document.documentElement.dir=l==='ar'?'rtl':'ltr';document.documentElement.lang=l;const entries=registry[kind].filter(e=>(e.id+' '+e.name+' '+e.body).toLowerCase().includes(q));$('status').textContent=(loaded?entries.length+' entries loaded':'Loading')+(missing.length?' · MISSING '+missing.join(', '):'');$('cards').replaceChildren(...entries.map(e=>{let card=document.createElement('article');card.className='item';let h=document.createElement('h3');h.textContent=e.id+' — '+e.name;let p=document.createElement('p');p.textContent=e.body;let s=document.createElement('small');s.textContent=e.status+' · '+e.category;card.append(h,s,p);return card}))}for(const id of ['lang','kind','query'])$(id).addEventListener('input',render);load();
</script></html>
