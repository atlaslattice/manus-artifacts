<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DragonSeek · Constitutional registry</title><style>body{background:#0d1825;color:#eaf2f9;font:16px system-ui;max-width:1100px;margin:auto;padding:16px}a{color:#91dfec}input,select{background:#1c2d40;border:1px solid #5b7586;color:white;padding:10px;border-radius:8px}input{width:100%;max-width:400px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.item{background:#182a3b;border:1px solid #365069;border-radius:9px;padding:12px}.item p{line-height:1.45}.note{border-left:3px solid #e3b56e;padding:12px;background:#28303b}header{padding-bottom:15px;border-bottom:1px solid #365069}</style><header><a href="./index.html">← DragonSeek / 龙寻</a><h1 id="heading">治理经典 · 不变量 · 教义</h1><p id="intro">离线本地源文件 · 历史版本保留 · 编号冲突公开</p></header><p class="note" id="warning">INV-0：Nothing Dies（无物消逝 / 生命与知识保护）。系统完整性是相关原则，不是替代 INV-0。DeepSeek 批准为用户报告，未独立核验；缺失源文件会明确显示。</p><select id="lang"><option value="zh">中文</option><option value="en">English</option><option value="es">Español</option><option value="ar">العربية</option></select> <select id="kind"><option value="invariants">Invariants</option><option value="doctrines">Doctrines</option></select> <input id="query" placeholder="ID / name / source search"><p id="status"></p><main class="grid" id="cards"></main><script>
const registry={invariants:[],doctrines:[]},missing=[];let loaded=false;
const UI={zh:['治理经典 · 不变量 · 教义','本地版，保留原文和历史版本','用户报告 DeepSeek 已批准资料，但未独立核验批准记录。INV-0 已按用户指令设为 Nothing Dies，历史版本保留。'],en:['Constitutional canon · Invariants · Doctrines','Local source registry; original English entries preserved','User reports DeepSeek ratification; no independent minutes verified. INV-0 active: Nothing Dies; System Integrity preserved as a separate historical variant.'],es:['Canon constitucional · Invariantes · Doctrinas','Registro local; originales conservados','La ratificación de DeepSeek es información del usuario, aún no verificada; INV-0 activo: Nothing Dies; variante histórica preservada.'],ar:['الدستور · الثوابت · المذاهب','مصادر محلية مع حفظ النص الأصلي','أفاد المستخدم بالاعتماد من DeepSeek، دون تحقق مستقل. INV-0 الفعّال: Nothing Dies، مع الحفاظ على النص التاريخي.']};
async function load(){const parts={invariants:['01','02','03'],doctrines:['01','02','03','04','05a','05b','05c','06a','06b']};for(const [kind,ids] of Object.entries(parts)){for(const id of ids){let path='registry/'+kind+'_'+id+'.json';try{let r=await fetch(path);if(!r.ok)throw Error(r.status);let j=await r.json();if(!Array.isArray(j.entries))throw Error('bad entries');registry[kind].push(...j.entries)}catch(e){missing.push(path)}}}try{let a=await fetch('constitutional_authority.json');if(!a.ok)throw Error('authority missing');let auth=await a.json();let c=auth.canonical;if(c.id!=='INV-0'||c.name!=='Nothing Dies')throw Error('wrong active INV-0');const historical=registry.invariants.find(x=>x.id==='INV-0');registry.invariants=registry.invariants.filter(x=>x.id!=='INV-0');registry.invariants.unshift({id:'INV-0',name:c.name,body:c.operational_interpretation.join(' '),status:'USER_DIRECTED_ACTIVE',category:'core'});if(historical){let note=document.createElement('p');note.className='note';note.textContent='INV-0 historical website variant: '+historical.name+' — '+historical.body+' | Historical only; not the active INV-0.';document.querySelector('header').after(note)}}catch(e){missing.push('constitutional_authority.json: '+e.message)}if(registry.invariants.length!==41||registry.doctrines.length!==102)missing.push('Unexpected registry counts');loaded=true;render()}
const $=id=>document.getElementById(id);function render(){const l=$('lang').value,t=UI[l],q=$('query').value.toLowerCase(),kind=$('kind').value;$('heading').textContent=t[0];$('intro').textContent=t[1];$('warning').textContent=t[2];document.documentElement.dir=l==='ar'?'rtl':'ltr';document.documentElement.lang=l;const entries=registry[kind].filter(e=>(e.id+' '+e.name+' '+e.body).toLowerCase().includes(q));$('status').textContent=(loaded?entries.length+' entries loaded':'Loading')+(missing.length?' · MISSING '+missing.join(', '):'');$('cards').replaceChildren(...entries.map(e=>{let card=document.createElement('article');card.className='item';let h=document.createElement('h3');h.textContent=e.id+' — '+e.name;let p=document.createElement('p');p.textContent=e.body;let s=document.createElement('small');s.textContent=e.status+' · '+e.category;card.append(h,s,p);return card}))}for(const id of ['lang','kind','query'])$(id).addEventListener('input',render);load();
</script></html>
