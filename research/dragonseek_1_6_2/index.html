 const s=LABELS[LOCALE]?.[k]??LABELS.en[k];
 if(s===undefined)return '⟦'+k+'⟧';
 if(!vars)return s;
 return s.replace(/\{(\w+)\}/g,(_,n)=>n in vars?String(vars[n]):'⟦'+n+'⟧');
}

/* =====================================================================
   SIMULATION
   ===================================================================== */
function simulate(solarOn,load,pv,capacity,sun,regime,rte){
 let soc=capacity,served=0,unserved=0,eff=Math.sqrt(rte),power=.25*capacity;
 for(let h=0;h<168;h++){
  const pvKw=solarOn?pv*Math.min(sun,regime)*Math.max(0,Math.sin(((h%24)-6)/12*Math.PI))*.85:0;
  const direct=Math.min(load,pvKw),deficit=load-direct,surplus=Math.max(0,pvKw-load);
  const charge=Math.min(surplus,power,(capacity-soc)/eff);soc+=charge*eff;
  const dis=Math.min(deficit,power,soc*eff);soc-=dis/eff;
  const miss=Math.max(0,deficit-dis);unserved+=miss;if(miss<1e-7)served++;
 }
 return {served,unserved,soc,pass:unserved<1e-7};
}

/* =====================================================================
   CRYPTO / FETCH
   ===================================================================== */
function getDigest(s){if(!globalThis.crypto?.subtle)throw Error('SHA-256 unavailable: serve over HTTPS or localhost');return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''))}
async function verifiedRaw(url,ms){
 const c=new AbortController(),timer=setTimeout(()=>c.abort(),ms);
 try{
  const r=await fetch(url,{signal:c.signal,cache:'no-store',redirect:'error'});
  if(!r.ok)throw Error('HTTP '+r.status);
  if(!r.url.startsWith('https://'))throw Error('non-HTTPS endpoint');
  return await r.text();
 }finally{clearTimeout(timer)}
}

/* =====================================================================
   FETCH — USGS
   ===================================================================== */
async function doFetch(){
 const btn=el('fetch');btn.disabled=true;text('err','');text('fetchState',stateLabel('FETCHING'));
 const ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),12000);
 try{
  const resp=await fetch(URL,{signal:ctl.signal,cache:'no-store',redirect:'error'});
  if(!resp.ok)throw Error('HTTP '+resp.status);
  const raw=await resp.text(),payload=JSON.parse(raw);
  if(payload.type!=='FeatureCollection'||!Array.isArray(payload.features))throw Error('Unexpected source format');
  if(!globalThis.crypto||!crypto.subtle)throw Error('SHA-256 unavailable in this context; use https:// or http://localhost.');
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));
  const hash=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');
  const records=payload.features.filter(f=>f&&f.geometry&&f.geometry.type==='Point'&&Array.isArray(f.geometry.coordinates)&&f.properties&&Number.isFinite(f.properties.time)&&Number.isFinite(f.properties.mag)&&Number.isFinite(f.geometry.coordinates[0])&&Number.isFinite(f.geometry.coordinates[1])&&Math.abs(f.geometry.coordinates[0])<=180&&Math.abs(f.geometry.coordinates[1])<=90).map(f=>({id:String(f.id),lon:f.geometry.coordinates[0],lat:f.geometry.coordinates[1],depth:f.geometry.coordinates[2],mag:f.properties.mag,time:f.properties.time,place:f.properties.place||'unknown',url:typeof f.properties.url==='string'&&f.properties.url.startsWith('https://earthquake.usgs.gov/')?f.properties.url:'https://earthquake.usgs.gov/'}));
  health={state:'CONNECTED_READONLY',retrieved:new Date().toISOString(),hash,records};
 }catch(e){
  health.state=health.retrieved?'STALE':'ERROR';
  text('err',t('err.fetch.prefix')+' '+String(e));
 }finally{clearTimeout(timeout);btn.disabled=false;renderAll()}
}

/* =====================================================================
   FETCH — NOAA SWPC
   ===================================================================== */
async function fetchSWPC(){
 const b=el('swpcFetch');b.disabled=true;text('swpcError','');text('swpcState',stateLabel('FETCHING'));
 try{
  const raw=await verifiedRaw(SWPC_URL,12000),hash=await getDigest(raw),data=JSON.parse(raw);
  if(!Array.isArray(data))throw Error('Unexpected NOAA data format');
  const rows=data.map(q=>({t:utc(q?.time_tag),kp:typeof q?.kp_index==='number'?q.kp_index:NaN,estimated:q?.estimated_kp??null}))
   .filter(q=>q.t!==null&&Number.isFinite(q.kp)&&q.kp>=0&&q.kp<=9)
   .sort((a,b)=>Date.parse(a.t)-Date.parse(b.t));
  if(!rows.length)throw Error('NO_VALID_KP_RECORD');
  const q=rows[rows.length-1],ret=new Date().toISOString();
  const displayKp=Number.isFinite(Number(q.estimated))&&q.estimated!==null&&Number(q.estimated)>=0&&Number(q.estimated)<=9?Number(q.estimated):q.kp;
  if(Date.parse(q.t)>Date.now()+300000)throw Error('OBSERVATION_TIMESTAMP_IN_FUTURE');
  swpcHealth.state='CONNECTED_READONLY';
  swpcHealth.hash=hash;swpcHealth.retrieved=ret;swpcHealth.record=q;swpcHealth.displayKp=displayKp;
  swpcHealth.series=rows.filter(r=>Date.parse(r.t)>=Date.now()-86400000);
 }catch(e){
  swpcHealth.state=swpcHealth.retrieved?'STALE':'ERROR';
  text('swpcError',t('err.swpc.prefix')+' '+String(e));
 }finally{b.disabled=false;renderAll()}
}

/* =====================================================================
   FETCH — NASA FIRMS
   ===================================================================== */
function parseCsvSafe(raw){
 const rows=[];let field='',row=[],quoted=false;
 for(let i=0;i<raw.length;i++){
  const ch=raw[i];
  if(ch==='"'){if(quoted&&raw[i+1]==='"'){field+='"';i++}else quoted=!quoted}
  else if(ch===','&&!quoted){row.push(field);field=''}
  else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&raw[i+1]==='\n')i++;row.push(field);field='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
  else field+=ch;
 }
 if(quoted)throw Error('Malformed CSV quoting');
 row.push(field);if(row.some(x=>x.trim()))rows.push(row);
 if(!rows.length)throw Error('Empty FIRMS CSV');
 const headings=rows.shift().map(x=>x.trim());
 if(!csvHeaders.every(h=>headings.includes(h)))throw Error('FIRMS API response missing expected CSV headers');
 const index=x=>headings.indexOf(x);
 return rows.map(r=>{
  const lat=Number(r[index('latitude')]),lon=Number(r[index('longitude')]);
  const date=(r[index('acq_date')]||'').trim();
  const rawTime=(r[index('acq_time')]||'').trim();
  const time=/^\d{4}$/.test(rawTime)?rawTime:null;
  const iso=time&&Number(time.slice(0,2))<24&&Number(time.slice(2,4))<60?utc(date+'T'+time.slice(0,2)+':'+time.slice(2,4)+':00Z'):null;
  return {lat,lon,time_utc:iso,confidence:r[index('confidence')],frp_mw:Number(r[index('frp')]),satellite:r[index('satellite')],instrument:r[index('instrument')]};
 }).filter(f=>Number.isFinite(f.lat)&&Math.abs(f.lat)<=90&&Number.isFinite(f.lon)&&Math.abs(f.lon)<=180&&f.time_utc!==null);
}
async function fetchFIRMS(){
 const btn=el('firmsFetch');
 const key=el('firmsKey').value.trim();el('firmsKey').value='';
 if(!key){text('firmsError',t('err.firms.key'));firmsHealth.state='NEEDS_KEY';renderAll();return}
 if(!/^[A-Za-z0-9_-]{8,200}$/.test(key)){text('firmsError',t('err.firms.format'));return}
 btn.disabled=true;text('firmsError','');text('firmsState',stateLabel('FETCHING'));
 const parsed=new URL('https://'+FIRMS_HOST+'/api/area/csv/'+encodeURIComponent(key)+'/VIIRS_SNPP_NRT/'+areaBBox()+'/1');
 try{
  if(parsed.hostname!==FIRMS_HOST||parsed.protocol!=='https:')throw Error('Host guard rejected endpoint');
  const raw=await verifiedRaw(parsed.href,15000);
  if(/Invalid MAP_KEY|exceeded|Error processing request/i.test(raw))throw Error(t('err.firms.quota'));
  const hash=await getDigest(raw),fires=parseCsvSafe(raw),ret=new Date().toISOString();
  firmsHealth={state:'CONNECTED_READONLY',hash,retrieved:ret,records:fires};
 }catch(e){
  firmsHealth.state=firmsHealth.retrieved?'STALE':'ERROR';
  text('firmsError',String(e)+' · '+t('err.firms.proxy'));
 }finally{btn.disabled=false;renderAll()}
}

 el('firmsKey').value='';
 firmsHealth={state:'NEEDS_KEY',retrieved:null,hash:null,records:[]};

}
