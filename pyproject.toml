[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manus-artifacts"
version = "0.0.0"
description = "Repository tooling configuration for manus-artifacts."
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = [
  "tests/gptdream",
  "tests/adversarial",
  "reference_impl/atlas_orcs/tests",
  "archive/boot/gptbrain/reference_impl",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "codebases",
  "archive/forks",
  "archive/chatlogs",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
