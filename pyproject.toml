[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manus-artifacts"
version = "0.0.0"
description = "Repository tooling configuration for manus-artifacts."
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
