[tool.pytest.ini_options]
testpaths = ["archive/boot/gptbrain/reference_impl"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "B006",  # mutable default arguments — sometimes intentional in scaffolds
    "SIM108", # ternary expressions — readability preference
]

[tool.ruff.lint.isort]
known-first-party = ["gptbrain_memory", "dream_memory_palace_reference_impl"]
