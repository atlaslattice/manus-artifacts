schema_name: atlas-audit-event
schema_version: "0.1"
type: object
properties:
  id:
    type: string
  canon_status:
    type: string
    default: not_canon
    enum: [not_canon, candidate, canon]
  deployment_status:
    type: string
    default: not_deployable
    enum: [not_deployable, candidate, deployable]
  created_at:
    type: string
  governance_event_id:
    type: [string, 'null']
x_constraints:
  - no_object_self_ratification
required: [id]
