# Atlas/ORCS Schema: Artifact
# NOT CANON — NOT DEPLOYABLE
# schema_version: "0.1"
# See: archive/spec/gptdream/appendices/APPENDIX_I_3_ATLAS_ORCS_SCHEMA_BUNDLE_v0.1.md

schema_version: "0.1"
schema_id: atlas-artifact
canon_status: not_canon
deployment_status: not_deployable

description: >
  Core artifact record in the Atlas/ORCS trust state machine.
  An artifact is any discrete piece of information, code, claim, or document
  managed by the governance system.

fields:
  artifact_id:
    type: string
    required: true
    description: Unique identifier (UUID or deterministic hash)

  artifact_type:
    type: string
    required: true
    enum: [document, code, claim, schema, receipt, synthesis, ratification_event, audit_event, other]

  author_id:
    type: string
    required: true
    description: Who created this artifact (agent ID, brain ID, or human ID)

  created_at:
    type: string
    format: iso8601
    required: true

  title:
    type: string
    required: false

  description:
    type: string
    required: false

  trust_state:
    type: string
    required: true
    enum: [raw, parsed, candidate, reviewed, ratified, active, under_review, superseded, revoked, quarantined, rejected]
    default: raw

  canon_status:
    type: string
    required: true
    enum: [not_canon, candidate, ratified_canon]
    default: not_canon
    note: >
      Can only be set to ratified_canon by an explicit ORCS-RATIFY event.
      Cannot be self-assigned.

  deployment_status:
    type: string
    required: true
    enum: [not_deployable, review_pending, approved, deployed]
    default: not_deployable
    note: >
      Can only change via an explicit deployment_governance_event.

  lineage:
    type: object
    required: false
    description: Provenance chain for this artifact
    fields:
      parent_artifact_id:
        type: string
        description: ID of parent artifact if derived
      source_refs:
        type: array
        items: string
        description: List of source references (URLs, SHAs, artifact IDs)
      summary_of:
        type: string
        description: If this is a summary, the ID of the artifact it summarizes
        note: Summary does not inherit source authority

  sha256:
    type: string
    required: false
    description: SHA-256 hash of artifact content if available

  ratification_event_id:
    type: string
    required: false
    description: ID of the ratification event (required for ratified_canon status)
    note: Self-ratification prohibited — ratifier_id must differ from author_id

  governance_events:
    type: array
    items: string
    description: List of ORCS event IDs applied to this artifact
    default: []

  tags:
    type: array
    items: string
    default: []

constraints:
  - canon_status == ratified_canon REQUIRES ratification_event_id IS NOT NULL
  - ratification_event.ratifier_id MUST NOT EQUAL author_id
  - summary_of IS NOT NULL IMPLIES artifact does NOT inherit source_artifact.canon_status
  - trust_state == ratified REQUIRES prior trust_state == reviewed
  - trust_state == active REQUIRES prior trust_state == ratified

examples:
  valid:
    artifact_id: "art-001"
    artifact_type: document
    author_id: "LucernaBrain"
    created_at: "2026-05-26T18:39:00Z"
    trust_state: candidate
    canon_status: not_canon
    deployment_status: not_deployable
    governance_events: []
    tags: ["gptdream", "not-canon"]
