$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Atlas Ratification Event"
description: "CANDIDATE ONLY — NOT CANON — NOT DEPLOYABLE. Machine-checkable Atlas/ORCS schema v0.1."
type: object
required:
  - schema_version
  - artifact_id
  - ratification_event_id
  - ratifier_id
  - target_artifact_id
  - self_ratified
properties:
  schema_version:
    const: "0.1"
  artifact_id:
    type: string
    minLength: 1
  canon_status:
    type: string
    default: not_canon
    enum: [not_canon, candidate, reviewed, ratified]
  deployment_status:
    type: string
    default: not_deployable
    enum: [not_deployable, candidate_only, deployable]
  self_ratified:
    const: false
  provenance_receipt_id:
    type: ["string", "null"]
  summary_ref:
    type: ["string", "null"]
  source_ref:
    type: ["string", "null"]
  ratification_event_id:
    type: string
  ratifier_id:
    type: string
  target_artifact_id:
    type: string
  governance_event_id:
    type: ["string", "null"]
additionalProperties: true
allOf:
  - not:
      properties:
        ratifier_id:
          const: "SELF"
