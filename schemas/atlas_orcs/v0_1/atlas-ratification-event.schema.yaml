# Atlas/ORCS Schema: Ratification Event
# NOT CANON — NOT DEPLOYABLE
# schema_version: "0.1"

schema_version: "0.1"
schema_id: atlas-ratification-event
canon_status: not_canon
deployment_status: not_deployable

description: >
  An explicit ratification event in the Atlas/ORCS governance system.
  Ratification is the ONLY mechanism by which an artifact can move toward canon status.
  This event must be explicitly created; it cannot be implied or inferred.
  CRITICAL: An artifact cannot self-ratify. The ratifier must differ from the author.

fields:
  event_id:
    type: string
    required: true

  event_type:
    type: string
    const: ORCS-RATIFY
    required: true

  artifact_id:
    type: string
    required: true
    description: The artifact being ratified

  ratifier_id:
    type: string
    required: true
    description: Who is ratifying (MUST differ from artifact.author_id)

  ratification_scope:
    type: array
    items: string
    required: true
    description: What aspects of the artifact are being ratified

  council_quorum:
    type: integer
    required: true
    minimum: 1
    description: Number of council members who participated in review

  council_members:
    type: array
    items: string
    required: false
    description: List of council member IDs who participated

  adjudicated_by:
    type: string
    required: false
    description: >
      For full canon, @atlaslattice adjudication is required.
      This field records who adjudicated.

  ratified_at:
    type: string
    format: iso8601
    required: true

  expiry:
    type: string
    format: iso8601
    required: true
    description: When this ratification expires. Expired ratification → artifact moves to under_review.

  prior_state:
    type: string
    required: true
    enum: [raw, parsed, candidate, reviewed, ratified, active, under_review, superseded, revoked, quarantined, rejected]
    description: Artifact's trust_state before this event

  target_state:
    type: string
    required: true
    enum: [ratified]
    description: Artifact's trust_state after this event (always ratified)

  canon_status:
    type: string
    required: true
    enum: [not_canon, candidate, ratified_canon]
    default: not_canon

  deployment_status:
    type: string
    required: true
    enum: [not_deployable, review_pending, approved, deployed]
    default: not_deployable

  notes:
    type: string
    required: false

constraints:
  - ratifier_id MUST NOT EQUAL artifact.author_id (no self-ratification)
  - prior_state MUST BE reviewed (cannot ratify from raw/parsed/candidate)
  - expiry MUST be in the future at time of creation
  - Expired ratification events DO NOT transfer ratified_canon status retroactively
  - This event is IMMUTABLE once created
  - A GitHub commit IS NOT a ratification event
