$schema: "https://json-schema.org/draft/2020-12/schema"
title: "atlas provenance receipt"
type: object
additionalProperties: true
properties:
  schema_version:
    type: string
    const: "0.1"
  receipt_id:
    type: string
  receipt_type:
    type: string
  receipt_hash:
    type: string
  claim_state:
    type: string
    enum: [candidate, reviewed, ratified]
  evidence_refs:
    type: array
    minItems: 1
    items:
      type: string
  source_basis:
    type: string
    enum: [full_source, summary_only, mixed]
required: [schema_version, receipt_id, receipt_type, receipt_hash, claim_state, evidence_refs]
