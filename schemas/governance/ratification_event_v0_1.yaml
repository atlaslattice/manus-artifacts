$schema: "https://json-schema.org/draft/2020-12/schema"
title: RatificationEvent
version: "0.1"
type: object
required:
  - ratification_event_id
  - canon_status
  - trust_state
  - human_root_approved
  - adjudicated_by
  - adjudicated_at
properties:
  ratification_event_id:
    type: string
    pattern: "^RAT-[0-9]{4}-[0-9]{2}-[A-Z0-9-]+$"
  canon_status:
    type: string
    enum: [draft, candidate, under_review, ratified, rejected]
  trust_state:
    type: string
    enum: [untrusted, pending_audit, audited, trusted]
  human_root_approved:
    type: boolean
  adjudicated_by:
    type: string
    minLength: 1
  adjudicated_at:
    type: string
    format: date-time
  council_review_refs:
    type: array
    items:
      type: string
  notes:
    type: string
additionalProperties: false
