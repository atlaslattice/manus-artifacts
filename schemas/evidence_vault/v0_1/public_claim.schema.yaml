$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Evidence Vault Public Claim v0.1"
type: object
additionalProperties: false
required:
  - schema_version
  - public_claim_id
  - claim_text
  - source_completeness
  - evidence_packet_ids
  - review_status
properties:
  schema_version: {type: string, const: "0.1"}
  public_claim_id: {type: string}
  claim_text: {type: string}
  source_completeness: {type: string, enum: [incomplete, complete]}
  evidence_packet_ids:
    type: array
    items: {type: string}
  review_status: {type: string, enum: [pending, approved, rejected]}
