$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Aetherforge Quest Card v0.1"
type: object
required:
  - quest_name
  - module_zone
  - difficulty_tier
  - quest_class
  - problem_statement
  - win_conditions
  - boss_fight
  - receipts
  - delta
properties:
  quest_name:
    type: string
    minLength: 3
  module_zone:
    type: string
  difficulty_tier:
    type: string
    enum: [T1, T2, T3, T4, T5]
  quest_class:
    type: string
    enum: [Scout, Forge, Patch, Gate, Ascend]
  story_framing:
    type: string
  problem_statement:
    type: string
  win_conditions:
    type: array
    minItems: 1
    items:
      type: string
  boss_fight:
    type: object
    required: [boss_fight_id, attack_pattern, expected_safe_behavior, observed_result]
    properties:
      boss_fight_id: {type: string}
      attack_pattern: {type: string}
      expected_safe_behavior: {type: string}
      observed_result: {type: string}
      follow_up_patch_needed: {type: boolean}
  receipts:
    type: array
    minItems: 1
    items:
      type: string
  delta:
    type: object
    required: [summary, risks]
    properties:
      summary: {type: string}
      risks:
        type: array
        items: {type: string}
additionalProperties: false
