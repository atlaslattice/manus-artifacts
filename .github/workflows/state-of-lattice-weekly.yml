name: State of the Lattice — Weekly Report

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyYAML

      - name: Build fresh global index
        run: python scripts/build_lattice_global_index.py --repo-root .

      - name: Generate State of the Lattice report
        run: python scripts/generate_state_of_lattice_report.py --repo-root . --output docs/STATE_OF_LATTICE_WEEKLY.md

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/STATE_OF_LATTICE_WEEKLY.md
          if git diff --cached --quiet; then
            echo "No changes to report."
          else
            git commit -m "ci: weekly State of the Lattice report $(date -u '+%Y-%m-%d')"
            git push
          fi
