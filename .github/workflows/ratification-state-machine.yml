name: Ratification State Machine

on:
  issues:
    types: [opened, labeled, unlabeled, reopened, closed]

permissions:
  contents: write
  issues: write

jobs:
  guide-candidate:
    if: github.event.action == 'opened' || (github.event.action == 'labeled' && github.event.label.name == 'candidate')
    runs-on: ubuntu-latest
    steps:
      - name: Post candidate workflow guidance
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: [
                "Candidate intake recorded.",
                "",
                "Required sequence:",
                "1. `candidate` label active",
                "2. Council sign-off evidence appended",
                "3. Add `canon-pending` label",
                "4. @atlaslattice closes issue with final adjudication comment",
                "5. Workflow emits a ratification tag on close"
              ].join("\n")
            });

  enforce-canon-pending-requirements:
    if: github.event.action == 'labeled' && github.event.label.name == 'canon-pending'
    runs-on: ubuntu-latest
    steps:
      - name: Check for candidate label and adjudication request
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map((l) => l.name);
            const hasCandidate = labels.includes('candidate');
            const body = issue.body || '';
            const hasAdjudicationText = body.toLowerCase().includes('adjudication');
            if (!hasCandidate || !hasAdjudicationText) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "`canon-pending` requires prior `candidate` label and adjudication details in the issue body."
              });
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'canon-pending'
              });
            }

  tag-ratification-on-close:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Create ratification tag for closed canon-pending issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map((l) => l.name);
            if (!labels.includes('canon-pending')) {
              core.info('Issue closed without canon-pending label; skipping tag creation.');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const refData = await github.rest.git.getRef({ owner, repo, ref: `heads/${defaultBranch}` });
            const date = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const tagName = `ratification/issue-${issue.number}-${date}`;
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tagName}`,
              sha: refData.data.object.sha
            });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: `Ratification tag created: \`${tagName}\``
            });
