name: Metadata Provenance Checks

on:
  push:
    paths:
      - "**/*.md"
      - "**/*.json"
      - "**/*.py"
      - "**/*.sh"
      - "**/*.toml"
      - "**/*.yaml"
      - "**/*.yml"
      - ".github/workflows/metadata-provenance-checks.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.json"
      - "**/*.py"
      - "**/*.sh"
      - "**/*.toml"
      - "**/*.yaml"
      - "**/*.yml"
      - ".github/workflows/metadata-provenance-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build artifact registry bundle
        run: python scripts/build_artifact_registry.py
      - name: Validate artifact metadata and graph consistency
        run: python scripts/validate_artifact_metadata.py
      - name: Run artifact metadata tests
        run: python -m pytest -q tests/test_artifact_metadata.py
