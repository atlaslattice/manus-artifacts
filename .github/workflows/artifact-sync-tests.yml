name: Artifact sync tests

on:
  push:
    paths:
      - "codebases/other/artifact_sync.py"
      - "codebases/atlas-lattice/artifact_sync.py"
      - "codebases/tests/test_artifact_sync.py"
      - ".github/workflows/artifact-sync-tests.yml"
  pull_request:
    paths:
      - "codebases/other/artifact_sync.py"
      - "codebases/atlas-lattice/artifact_sync.py"
      - "codebases/tests/test_artifact_sync.py"
      - ".github/workflows/artifact-sync-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run artifact sync tests
        run: python -m pytest codebases/tests/test_artifact_sync.py -v
