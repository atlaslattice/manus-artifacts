name: Hypercube Integrity Gates

on:
  push:
    paths:
      - '**/*.md'
      - 'scripts/build_lattice_global_index.py'
      - 'scripts/validate_hypercube_integrity.py'
      - 'archive/knowledge_graph/lattice_kg/v0_6/**'
      - 'tests/test_hypercube_integrity.py'
      - '.github/workflows/hypercube-integrity.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/build_lattice_global_index.py'
      - 'scripts/validate_hypercube_integrity.py'
      - 'archive/knowledge_graph/lattice_kg/v0_6/**'
      - 'tests/test_hypercube_integrity.py'
      - '.github/workflows/hypercube-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hypercube-integrity:
    name: 12D hypercube integrity — one lattice, not a bunch of legos
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest -q

      - name: Build lattice global index
        run: python scripts/build_lattice_global_index.py --report

      - name: Run hypercube integrity gates
        run: python scripts/validate_hypercube_integrity.py

      - name: Run hypercube integrity unit tests
        run: python -m pytest -q tests/test_hypercube_integrity.py
