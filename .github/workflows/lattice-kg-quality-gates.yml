name: Lattice KG quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lattice-kg:
    name: Build and validate lattice knowledge graph
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest pyyaml

      - name: Build graph index
        run: |
          python scripts/build_lattice_global_index.py

      - name: Validate lattice quality gates
        run: |
          python scripts/validate_lattice_quality_gates.py

      - name: Run lattice pytest coverage
        run: |
          python -m pytest -q tests/test_lattice_kg_hypercube_program.py

      - name: Smoke test graph query CLI
        run: |
          python scripts/kg_query.py "graph index" --seat S7
