name: Docs Link Checks

on:
  push:
    paths:
      - "**.md"
      - "docs/**"
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  links:
    name: Relative Link Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check relative markdown links
        run: |
          set -euo pipefail
          FAIL=0
          while IFS= read -r -d '' file; do
            # Extract relative links (not http/https/mailto/#)
            grep -oP '\[.*?\]\(\K[^)]+' "$file" | \
            grep -v '^https\?://' | \
            grep -v '^mailto:' | \
            grep -v '^#' | \
            while IFS= read -r link; do
              # Strip anchors
              target="${link%%#*}"
              [ -z "$target" ] && continue
              dir="$(dirname "$file")"
              resolved="$dir/$target"
              if [ ! -e "$resolved" ]; then
                echo "::warning file=$file::Broken relative link: $link"
                FAIL=1
              fi
            done
          done < <(find . -name "*.md" -not -path "./.git/*" -print0)
          exit $FAIL
        continue-on-error: true
