name: Docs Link Checks

on:
  push:
    paths:
      - '**/*.md'
      - '.github/workflows/docs-link-checks.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/docs-link-checks.yml'
  schedule:
    # Run weekly on Mondays at 07:00 UTC to catch external link rot
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check internal relative links
        run: |
          pip install --quiet markdown-link-check 2>/dev/null || true
          # Use find + basic relative-link validation
          failed=0
          while IFS= read -r mdfile; do
            # Extract relative links (not http/https/mailto/anchor-only)
            grep -oP '\[.*?\]\(\K[^)]+' "$mdfile" | grep -v '^http' | grep -v '^#' | grep -v '^mailto' | while read -r link; do
              # Strip anchor
              target="${link%%#*}"
              [ -z "$target" ] && continue
              dir="$(dirname "$mdfile")"
              resolved="$dir/$target"
              if [ ! -e "$resolved" ]; then
                echo "::warning file=$mdfile::Broken relative link: $link"
              fi
            done
          done < <(find . -name "*.md" -not -path "./.git/*")
          echo "Relative link scan complete."
