name: "📦 Raw Export"
description: "Raw transcript or data export — routes to HashlightBrain / AtlasBrain"
title: "[RAW-EXPORT] "
labels:
  - hashlight
  - atlasbrain
  - native-thread-ingestion
  - not-canon
  - not-deployable
  - needs-review
body:
  - type: markdown
    attributes:
      value: |
        **Lane:** Raw Export → **HashlightBrain** / **AtlasBrain**
        
        Raw exports are `not-canon` and `not-deployable` by default. All raw ingestion issues **must** provide a `raw_export_status`.

  - type: input
    id: export_source
    attributes:
      label: Export source
      placeholder: "e.g. ChatGPT export, Claude thread, Notion dump, Drive folder"
    validations:
      required: true

  - type: input
    id: export_date
    attributes:
      label: Export date (YYYY-MM-DD)
    validations:
      required: true

  - type: dropdown
    id: raw_export_status
    attributes:
      label: raw_export_status
      description: "REQUIRED for all raw ingestion issues (acceptance criterion)."
      options:
        - "pending-triage"
        - "in-triage"
        - "triaged-clean"
        - "triaged-contaminated"
        - "quarantined"
        - "promoted-to-candidate"
    validations:
      required: true

  - type: textarea
    id: export_contents
    attributes:
      label: Contents summary
      description: What is in this export? List top-level topics or artifact types.
    validations:
      required: true

  - type: input
    id: archive_path
    attributes:
      label: Archive path (if already committed)
      placeholder: "e.g. archive/raw/transcripts/2026-05-26/"
    validations:
      required: false

  - type: dropdown
    id: routing_brain
    attributes:
      label: Primary routing brain
      options:
        - HashlightBrain
        - AtlasBrain
        - HashlightBrain + AtlasBrain
    validations:
      required: true

  - type: checkboxes
    id: acceptance_criteria
    attributes:
      label: Acceptance checklist
      options:
        - label: Issue has a lane label (`hashlight` or `atlasbrain`)
          required: true
        - label: "`raw_export_status` field populated"
          required: true
        - label: "`not-canon` label applied"
          required: true
        - label: "`not-deployable` label applied"
          required: true
        - label: "`needs-review` label applied"
          required: true
        - label: Export source and date provided
          required: true
