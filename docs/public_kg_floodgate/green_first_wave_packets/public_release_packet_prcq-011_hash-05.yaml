strongest_safe_claim: >
  The Google Sheets export checklist defines the minimum required steps
  before any Google Sheet may be classified as frozen_snapshot or
  full_raw_export_attached in this system.

checklist:
  - "[ ] Confirm sheet is not actively being edited"
  - "[ ] Record sheet ID and current revision"
  - "[ ] Export relevant tabs as CSV or TSV"
  - "[ ] Upload exported file(s) to repository at pinned path"
  - "[ ] Record source_id as gsheet:{sheet_id}@frozen:{date}"
  - "[ ] Update raw_export_status to frozen_snapshot"
  - "[ ] Note any tabs marked [PRIVATE] or [PENDING]"
  - "[ ] Route to Hashlight for hash gap review"

overclaims_to_avoid:
