checklist:
  - "[ ] Confirm document is not actively being edited"
  - "[ ] Record document ID and current revision"
  - "[ ] Export as Markdown or plain text"
  - "[ ] Upload exported file to repository at pinned path"
  - "[ ] Record source_id as gdoc:{doc_id}@frozen:{date}"
  - "[ ] Update raw_export_status to frozen_snapshot"
  - "[ ] Note any sections marked [REDACTED] or [PENDING]"
  - "[ ] Route to Hashlight for hash gap review"

