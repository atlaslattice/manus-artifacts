<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Atlas Lattice Live KG Explorer</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #0a0a0f; color: #e8ecff; }
      header { padding: 12px 16px; border-bottom: 1px solid #27304f; display: flex; gap: 16px; align-items: center; }
      .grid { display: grid; grid-template-columns: 1fr 360px; min-height: calc(100vh - 58px); }
      #graph { min-height: calc(100vh - 58px); }
      aside { border-left: 1px solid #27304f; padding: 12px; overflow: auto; }
      input { width: 100%; padding: 8px; border: 1px solid #27304f; background: #121a31; color: #e8ecff; }
      .result { border: 1px solid #27304f; border-radius: 8px; padding: 8px; margin-top: 8px; }
      .meta { color: #a4b1d8; font-size: 12px; }
      a { color: #6eb8ff; text-decoration: none; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; border: 1px solid #3c4b77; font-size: 11px; margin-right: 6px; }
    </style>
    <script src="https://unpkg.com/3d-force-graph"></script>
  </head>
  <body>
    <header>
      <strong>Atlas Lattice Live KG Explorer</strong>
      <span id="stats" class="meta">Loading…</span>
      <a href="../artifact_registry.v0_1.json">Registry</a>
      <a href="graph_data_autogenerated.json">Graph JSON</a>
      <a href="search_index_autogenerated.json">Search JSON</a>
    </header>

    <div class="grid">
      <div id="graph"></div>
      <aside>
        <h3>Static Search</h3>
        <input id="search" type="search" placeholder="Search title, ID, path, excerpt..." />
        <div id="results"></div>
      </aside>
    </div>

    <script>
      const graphEl = document.getElementById('graph');
      const statsEl = document.getElementById('stats');
      const searchEl = document.getElementById('search');
      const resultsEl = document.getElementById('results');

      let indexEntries = [];

      function renderResults(query = '') {
        const q = query.trim().toLowerCase();
        const filtered = !q
          ? indexEntries.slice(0, 25)
          : indexEntries.filter((entry) =>
              [entry.id, entry.title, entry.path, entry.excerpt, entry.artifact_type]
                .join(' ')
                .toLowerCase()
                .includes(q)
            ).slice(0, 60);

        resultsEl.innerHTML = filtered.map((entry) => `
          <div class="result">
            <div><strong>${entry.title || entry.id}</strong></div>
            <div class="meta">${entry.id} · ${entry.artifact_type} · ${entry.status}</div>
            <div class="meta"><code>${entry.path}</code></div>
            <div style="margin-top:6px">${entry.excerpt || ''}</div>
          </div>
        `).join('');
      }

      Promise.all([
        fetch('./graph_data_autogenerated.json').then((r) => r.json()),
        fetch('./search_index_autogenerated.json').then((r) => r.json())
      ]).then(([graphData, searchData]) => {
        indexEntries = searchData.entries || [];
        renderResults('');

        statsEl.textContent = `${graphData.node_count} nodes · ${graphData.edge_count} edges · ${searchData.entry_count} indexed docs`;

        const graph = ForceGraph3D()(graphEl)
          .graphData(graphData)
          .nodeLabel((n) => `${n.id}\n${n.name}\n${n.hsn}`)
          .nodeAutoColorBy('artifact_type')
          .linkLabel((l) => l.relation)
          .linkOpacity(0.35)
          .linkDirectionalParticles(1)
          .backgroundColor('#0a0a0f');

        graph.d3Force('charge').strength(-220);
      }).catch((error) => {
        statsEl.textContent = `Failed to load explorer payload: ${error}`;
      });

      searchEl.addEventListener('input', (event) => renderResults(event.target.value));
    </script>
  </body>
</html>
